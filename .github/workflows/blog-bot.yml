name: Generar borrador de blog

on:
  schedule:
    # 1 y 15 de cada mes, 09:00 hora Perú (UTC-5) = 14:00 UTC
    - cron: "0 14 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del agente
        working-directory: scripts/blog-bot
        run: npm install

      - name: Configurar git
        run: |
          git config user.name "ESVA Blog Bot"
          git config user.email "blog-bot@esva.pe"

      - name: Generar artículo y abrir PR
        working-directory: scripts/blog-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate-post.mjs
